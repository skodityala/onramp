<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Onramp">
  <rect width="512" height="512" rx="96" fill="#FAF9F6"/>
  <!-- The onramp: a curved line rising from lower-left to upper-right -->
  <path d="M 96 400 Q 256 400 256 256 T 416 112" fill="none" stroke="#1F6F5C" stroke-width="40" stroke-linecap="round"/>
  <!-- The starting dot: where the user is now -->
  <circle cx="96" cy="400" r="28" fill="#1F6F5C"/>
</svg>
