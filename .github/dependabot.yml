version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      types:
        patterns:
          - "@types/*"
      vitest:
        patterns:
          - "vitest*"
          - "@testing-library/*"
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
